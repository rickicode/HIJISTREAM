name: Build Android APK

on:
  push:
    tags: ['v*']
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build APK (arm64-v8a & armeabi-v7a)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: apps/mobile

      - name: Generate native Android project
        run: bunx expo prebuild --platform android --no-install
        working-directory: apps/mobile

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Configure ABI splits for ARM
        run: |
          # Add ABI splits to build.gradle to generate separate APKs for each architecture
          sed -i '/android {/a \    splits {\n        abi {\n            enable true\n            reset()\n            include "arm64-v8a", "armeabi-v7a"\n            universalApk true\n        }\n    }' apps/mobile/android/app/build.gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: apps/mobile/android

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        working-directory: apps/mobile/android

      - name: List generated APKs
        run: find apps/mobile/android -name "*.apk" -type f

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hijistream-apk
          path: |
            apps/mobile/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload APKs to Release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: apps/mobile/android/app/build/outputs/apk/release/*.apk
          generate_release_notes: true
