name: Build Android APK

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prebuild:
    name: Prebuild & Cache
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: apps/mobile/node_modules
          key: mobile-deps-${{ hashFiles('apps/mobile/bun.lock', 'apps/mobile/package.json') }}
          restore-keys: mobile-deps-

      - name: Install dependencies
        run: bun install
        working-directory: apps/mobile

      - name: Generate native Android project
        run: bunx expo prebuild --platform android --no-install
        working-directory: apps/mobile

      - name: Upload prebuild artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-prebuild
          path: apps/mobile/android
          retention-days: 1

  build-apk:
    name: Build ${{ matrix.abi }}
    runs-on: ubuntu-latest
    needs: prebuild
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download prebuild
        uses: actions/download-artifact@v4
        with:
          name: android-prebuild
          path: apps/mobile/android

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.abi }}-${{ hashFiles('apps/mobile/android/gradle/wrapper/gradle-wrapper.properties', 'apps/mobile/android/app/build.gradle') }}
          restore-keys: |
            gradle-${{ matrix.abi }}-
            gradle-

      - name: Configure ABI filter for ${{ matrix.abi }}
        run: |
          cat >> apps/mobile/android/app/build.gradle << 'EOF'

          android.defaultConfig.ndk {
              abiFilters "${{ matrix.abi }}"
          }
          EOF

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: apps/mobile/android

      - name: Build Release APK (${{ matrix.abi }})
        run: ./gradlew assembleRelease --no-daemon --parallel --max-workers=2 -Dorg.gradle.jvmargs="-Xmx2g"
        working-directory: apps/mobile/android

      - name: Get app version
        id: version
        run: |
          VERSION=$(cat apps/mobile/app.json | python3 -c "import sys,json; print(json.load(sys.stdin)['expo']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: |
          APK=$(find apps/mobile/android/app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" "HIJISTREAM-${{ matrix.abi }}-v${{ steps.version.outputs.version }}.apk"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.abi }}
          path: HIJISTREAM-${{ matrix.abi }}-v${{ steps.version.outputs.version }}.apk
          retention-days: 30

  combine:
    name: Combine & Release
    runs-on: ubuntu-latest
    needs: build-apk
    steps:
      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: apk-*
          merge-multiple: true
          path: apks

      - name: List APKs
        run: ls -la apks/

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HIJISTREAM-all-apks
          path: apks/
          retention-days: 30

      - name: Upload APKs to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
          generate_release_notes: true
