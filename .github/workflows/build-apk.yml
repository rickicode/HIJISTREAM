name: Build Android APK

on:
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'App version (e.g. 1.2.0). Leave empty to use version from app.json'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  build-mobile:
    name: Mobile ${{ matrix.abi }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, armeabi-v7a, x86_64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            apps/mobile/node_modules
            packages/shared/node_modules
          key: mobile-deps-${{ hashFiles('bun.lock', 'apps/mobile/package.json') }}
          restore-keys: mobile-deps-

      - name: Install dependencies
        run: bun install

      - name: Determine app version
        id: version
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          TAG_VERSION="${{ github.event.release.tag_name }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [ -n "$TAG_VERSION" ]; then
            VERSION="${TAG_VERSION#v}"
            VERSION="${VERSION#V}"
          else
            VERSION=$(python3 -c "import json; print(json.load(open('apps/mobile/app.json'))['expo']['version'])")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Patch app.json with resolved version
        run: |
          python3 - <<'EOF'
          import json
          path = 'apps/mobile/app.json'
          version = "${{ steps.version.outputs.version }}"
          cfg = json.load(open(path))
          cfg['expo']['version'] = version
          parts = (version.split('.') + ['0', '0', '0'])[:3]
          nums = [int(''.join(ch for ch in p if ch.isdigit()) or '0') for p in parts]
          major, minor, patch = nums
          version_code = max(1, major * 10000 + minor * 100 + patch)
          cfg['expo'].setdefault('android', {})
          cfg['expo']['android']['versionCode'] = version_code
          json.dump(cfg, open(path, 'w'), indent=2)
          print(f'Patched app.json: version={version} versionCode={version_code}')
          EOF

      - name: Generate native Android project
        run: bunx expo prebuild --platform android --no-install
        working-directory: apps/mobile

      - name: Patch ExpoModulesCorePlugin for CI compatibility
        run: |
          PLUGIN_FILE="node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle"
          if [ -f "$PLUGIN_FILE" ]; then
            sed -i 's/from components.release/from components.findByName("release") ?: components.first()/' "$PLUGIN_FILE"
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-mobile-${{ matrix.abi }}-${{ hashFiles('apps/mobile/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-mobile-${{ matrix.abi }}-
            gradle-mobile-

      - name: Configure ABI filter
        run: |
          echo "" >> apps/mobile/android/app/build.gradle
          echo "android.defaultConfig.ndk.abiFilters '${{ matrix.abi }}'" >> apps/mobile/android/app/build.gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: apps/mobile/android

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --parallel --max-workers=2 -Dorg.gradle.jvmargs="-Xmx2g" --warning-mode=none
        working-directory: apps/mobile/android

      - name: Rename APK
        run: |
          APK=$(find apps/mobile/android/app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" "HIJISTREAM-${{ matrix.abi }}-v${{ steps.version.outputs.version }}.apk"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-mobile-${{ matrix.abi }}
          path: HIJISTREAM-${{ matrix.abi }}-v${{ steps.version.outputs.version }}.apk
          retention-days: 30

  build-tv:
    name: TV armeabi-v7a
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache node_modules
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            apps/tv/node_modules
            packages/shared/node_modules
          key: tv-deps-${{ hashFiles('bun.lock', 'apps/tv/package.json') }}
          restore-keys: tv-deps-

      - name: Install dependencies
        run: bun install

      - name: Determine app version
        id: version
        run: |
          INPUT_VERSION="${{ github.event.inputs.version }}"
          TAG_VERSION="${{ github.event.release.tag_name }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          elif [ -n "$TAG_VERSION" ]; then
            VERSION="${TAG_VERSION#v}"
            VERSION="${VERSION#V}"
          else
            VERSION=$(python3 -c "import json; print(json.load(open('apps/tv/app.json'))['expo']['version'])")
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Patch app.json with resolved version
        run: |
          python3 - <<'EOF'
          import json
          path = 'apps/tv/app.json'
          version = "${{ steps.version.outputs.version }}"
          cfg = json.load(open(path))
          cfg['expo']['version'] = version
          parts = (version.split('.') + ['0', '0', '0'])[:3]
          nums = [int(''.join(ch for ch in p if ch.isdigit()) or '0') for p in parts]
          major, minor, patch = nums
          version_code = max(1, major * 10000 + minor * 100 + patch)
          cfg['expo'].setdefault('android', {})
          cfg['expo']['android']['versionCode'] = version_code
          json.dump(cfg, open(path, 'w'), indent=2)
          print(f'Patched: version={version} versionCode={version_code}')
          EOF

      - name: Generate native Android project
        run: bunx expo prebuild --platform android --no-install
        working-directory: apps/tv

      - name: Patch ExpoModulesCorePlugin for CI compatibility
        run: |
          PLUGIN_FILE="node_modules/expo-modules-core/android/ExpoModulesCorePlugin.gradle"
          if [ -f "$PLUGIN_FILE" ]; then
            sed -i 's/from components.release/from components.findByName("release") ?: components.first()/' "$PLUGIN_FILE"
          fi

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-tv-${{ hashFiles('apps/tv/android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-tv-

      - name: Configure ABI filter
        run: |
          echo "" >> apps/tv/android/app/build.gradle
          echo "android.defaultConfig.ndk.abiFilters 'armeabi-v7a'" >> apps/tv/android/app/build.gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew
        working-directory: apps/tv/android

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon --parallel --max-workers=2 -Dorg.gradle.jvmargs="-Xmx2g" --warning-mode=none
        working-directory: apps/tv/android

      - name: Rename APK
        run: |
          APK=$(find apps/tv/android/app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" "HIJISTREAM-TV-v${{ steps.version.outputs.version }}.apk"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: apk-tv
          path: HIJISTREAM-TV-v${{ steps.version.outputs.version }}.apk
          retention-days: 30

  release:
    name: Combine & Release
    runs-on: ubuntu-latest
    needs: [build-mobile, build-tv]
    steps:
      - name: Download all APK artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: apk-*
          merge-multiple: true
          path: apks

      - name: List APKs
        run: ls -la apks/

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v7
        with:
          name: HIJISTREAM-all-apks
          path: apks/
          retention-days: 30

      - name: Upload APKs to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
          generate_release_notes: true
