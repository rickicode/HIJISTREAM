name: Build & Test Web

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-web:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install
        working-directory: apps/web

      - name: Lint
        run: bun run lint
        working-directory: apps/web

      - name: Type Check
        run: bun run typecheck
        working-directory: apps/web

      - name: Build
        run: bun run build
        working-directory: apps/web

      - name: Test
        run: bun run test
        working-directory: apps/web
