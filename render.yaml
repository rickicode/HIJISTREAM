services:
  - type: web
    name: hijistream-api
    runtime: docker
    dockerfilePath: apps/server/Dockerfile
    dockerContext: apps/server
    envVars:
      - key: PORT
        value: 3001
    autoDeploy: true
    healthCheckPath: /health

  - type: web
    name: hijistream
    runtime: static
    buildCommand: cd apps/web && bun install && bun run build
    staticPublishPath: apps/web/dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_URL
        value: https://hijistream-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
